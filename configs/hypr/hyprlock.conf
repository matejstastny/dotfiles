background {
    monitor =
    color = rgba(0a0812ff)
    blur_passes = 0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(f4eeffff)
    font_size = 80
    font_family = Maple Mono NF Bold
    shadow_passes = 2
    shadow_color = rgba(7c5cbf55)
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(9b8ab0ff)
    font_size = 16
    font_family = Maple Mono NF
    position = 0, 90
    halign = center
    valign = center
}

# Stars
label {
    monitor =
    text = ✦ ✧ ✦
    color = rgba(7c5cbf88)
    font_size = 18
    font_family = Maple Mono NF
    position = 0, 48
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(7c5cbf)
    inner_color = rgb(110d1a)
    font_color = rgb(e0d4f0)
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text = <span foreground="##9b8ab0"><i>✦ password</i></span>
    hide_input = false
    rounding = 8
    check_color = rgb(7c5cbf)
    fail_color = rgb(c47a9b)
    fail_text = <span foreground="##c47a9b"><i>$FAIL ($ATTEMPTS)</i></span>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgb(c4a87a)
    position = 0, -30
    halign = center
    valign = center
}
