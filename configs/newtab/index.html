<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>~</title>
        <link
            rel="icon"
            href="favicon.png"
        />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap");

            :root {
                --base: #11111b;
                --surface: #181825;
                --overlay: #25253a;
                --muted: #3d3d5c;
                --purple: #7878c8;
                --lila: #9898e0;
                --rose: #c47ab8;
                --text: #dce0f4;
                --dim: #9898c0;
                --bright: #f0f0ff;

                /* accent ramp, rose → purple, cycled across groups */
                --a1: #c47ab8;
                --a2: #b07fc8;
                --a3: #9898e0;
                --a4: #8488d4;
                --a5: #7878c8;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
            }

            body {
                background:
                    radial-gradient(
                        ellipse 80% 55% at 50% -5%,
                        rgba(120, 120, 200, 0.07) 0%,
                        transparent 70%
                    ),
                    var(--base);
                color: var(--text);
                font-family: "Maple Mono NF", "JetBrains Mono", monospace;
                -webkit-font-smoothing: antialiased;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            canvas {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
            }

            .page {
                position: relative;
                z-index: 1;
                width: min(1080px, calc(100vw - 56px));
                max-height: calc(100vh - 56px);
                animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ── link groups ── */
            .links {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(188px, 1fr));
                gap: 28px 14px;
                align-items: start;
            }

            .group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .group-name {
                display: flex;
                align-items: center;
                gap: 7px;
                margin: 0 2px 6px;
                color: var(--accent);
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 2.5px;
                text-transform: uppercase;
                user-select: none;
            }
            .group-name::before {
                content: "✦";
                font-size: 7px;
                letter-spacing: 0;
                opacity: 0.8;
            }
            .group-name::after {
                content: "";
                flex: 1;
                height: 1px;
                background: linear-gradient(
                    to right,
                    color-mix(in srgb, var(--accent) 28%, transparent),
                    transparent
                );
            }

            a {
                position: relative;
                display: flex;
                align-items: center;
                gap: 9px;
                padding: 12px 14px;
                border-radius: 11px;
                border: 1px solid rgba(120, 120, 200, 0.1);
                background: rgba(24, 24, 37, 0.55);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                color: var(--text);
                font-size: 13px;
                text-decoration: none;
                outline: none;
                transition:
                    color 0.16s ease,
                    border-color 0.16s ease,
                    background 0.16s ease,
                    box-shadow 0.16s ease,
                    transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* accent dot, grows into a bar on hover */
            a::before {
                content: "";
                width: 4px;
                height: 4px;
                flex: none;
                border-radius: 100px;
                background: var(--accent);
                opacity: 0.45;
                transition:
                    height 0.16s cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 0.16s ease;
            }

            a:hover,
            a:focus-visible {
                color: var(--bright);
                background: rgba(37, 37, 58, 0.72);
                border-color: color-mix(in srgb, var(--accent) 42%, transparent);
                box-shadow:
                    0 6px 18px -8px rgba(0, 0, 0, 0.55),
                    0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
                transform: translateY(-2px);
            }
            a:hover::before,
            a:focus-visible::before {
                height: 15px;
                opacity: 1;
            }

            a:focus-visible {
                border-color: var(--accent);
            }

            a:active {
                transform: translateY(0);
                background: rgba(24, 24, 37, 0.8);
            }

            #error {
                color: var(--muted);
                font-size: 12px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <div class="page">
            <div
                class="links"
                id="links"
            ></div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
