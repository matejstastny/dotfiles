<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>~</title>
    <link
      rel="icon"
      href="https://github.com/matejstastny/dotfiles/blob/asahi/configs/newtab/icon.png?raw=true"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap");

      /* Ellie — midnight with stars */
      :root {
        --base: #171221;
        --surface: #1e1729;
        --overlay: #2a2038;
        --muted: #3d2f52;
        --purple: #7c5cbf;
        --lavender: #a888d6;
        --rose: #c47a9b;
        --rose-deep: #b06885;
        --text: #e0d4f0;
        --dim: #9b8ab0;
        --bright: #f4eeff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--base);
        color: var(--text);
        font-family: "Maple Mono NF", "JetBrains Mono", monospace;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
      }

      .container {
        width: 640px;
        padding: 20px;
      }

      /* Prompt segments: user@host path $ */
      .user {
        color: var(--rose);
        font-weight: 700;
      }
      .at {
        color: var(--dim);
      }
      .host {
        color: var(--purple);
        font-weight: 700;
      }
      .path {
        color: var(--dim);
      }
      .sign {
        color: var(--purple);
      }
      .cmd {
        color: var(--bright);
      }
      .comment {
        color: var(--muted);
      }

      /* A shell line: prompt + command */
      .line {
        margin-bottom: 4px;
      }

      /* neofetch-style header */
      .header {
        margin-bottom: 24px;
      }
      .header .row {
        color: var(--dim);
      }
      .header .row .key {
        color: var(--rose);
      }

      /* ls-style grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px;
        margin: 14px 0 28px;
      }

      .cat {
        margin-bottom: 8px;
        font-weight: 700;
      }
      .cat::before {
        content: "✦ ";
        color: inherit;
        opacity: 0.7;
      }
      .cat-media {
        color: var(--rose);
      }
      .cat-code {
        color: var(--purple);
      }
      .cat-crypto {
        color: var(--lavender);
      }
      .cat-reddit {
        color: var(--rose-deep);
      }
      .cat-dailies {
        color: var(--purple);
      }

      a {
        color: var(--text);
        text-decoration: none;
        display: block;
        margin-bottom: 5px;
      }
      a::before {
        content: "› ";
        color: var(--muted);
      }
      a:hover {
        color: var(--bright);
      }
      a:hover::before {
        color: var(--rose);
      }

      /* Search line */
      .search-container {
        display: flex;
        align-items: center;
        width: 100%;
        white-space: nowrap;
      }
      .search-container form {
        display: flex;
        flex-grow: 1;
        margin: 0;
        position: relative;
      }
      input {
        background: transparent;
        border: none;
        color: var(--text);
        font-family: inherit;
        font-size: inherit;
        outline: none;
        margin-left: 8px;
        width: 100%;
        caret-color: transparent;
      }

      /* Blinking block cursor that follows the typed text */
      .cursor {
        position: absolute;
        top: 50%;
        left: 8px;
        transform: translateY(-50%);
        width: 8px;
        height: 15px;
        background: var(--purple);
        animation: blink 1s step-end infinite;
        pointer-events: none;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="line">
          <span class="user">elara</span><span class="at">@</span
          ><span class="host">helium</span> <span class="path">~</span>
          <span class="sign">$</span>
          <span class="cmd">neofetch</span>
        </div>
        <div class="row"><span class="key">os</span>........ ellie ✧</div>
        <div class="row"><span class="key">shell</span>..... zsh</div>
        <div class="row">
          <span class="key">uptime</span>.... <span id="clock">--:--:--</span>
        </div>
      </div>

      <div class="line">
        <span class="user">elara</span><span class="at">@</span
        ><span class="host">helium</span> <span class="path">~/bookmarks</span>
        <span class="sign">$</span>
        <span class="cmd">ls</span>
      </div>

      <div class="grid">
        <div>
          <div class="cat cat-reddit">me/</div>
          <a href="https://github.com/matejstastny">github</a>
          <a href="https://github.com/matejstastny/dotfiles">dotfiles</a>
        </div>
        <div>
          <div class="cat cat-code">trickfire/</div>
          <a href="https://github.com/TrickfireRobotics">org</a>
          <a href="https://github.com/TrickfireRobotics/dashboard">dashboard</a>
          <a
            href="https://github.com/TrickfireRobotics/TrickFireRobotics.github.io"
            >docs-fw</a
          >
          <a href="https://github.com/TrickfireRobotics/gazebo-simulations"
            >simulation</a
          >
        </div>
        <div>
          <div class="cat cat-crypto">repos/</div>
          <a href="https://github.com/TrickfireRobotics/trickfire-urc">urc</a>
          <a href="https://github.com/TrickfireRobotics/ak-series-lib"
            >motors</a
          >
          <a href="https://github.com/TrickfireRobotics/trickfire-drone"
            >drone</a
          >
        </div>
        <div>
          <div class="cat cat-media">web/</div>
          <a href="http://trickfirerobotics.com/">website</a>
          <a href="http://docs.trickfirerobotics.com/">docs</a>
          <a href="http://dashboard.trickfirerobotics.com/">dashboard</a>
        </div>
      </div>

      <div class="search-container">
        <span class="user">elara</span><span class="at">@</span
        ><span class="host">helium</span>
        <span class="path" style="margin-left: 6px">~</span>
        <span class="sign" style="margin-left: 6px">$</span>
        <form action="https://www.duckduckgo.com/" method="get" autofocus>
          <input
            id="search"
            type="text"
            name="q"
            autofocus
            autocomplete="off"
            spellcheck="false"
          />
          <span class="cursor" id="cursor"></span>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
