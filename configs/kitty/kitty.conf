# font
font_family             Maple Mono NF
bold_font               Maple Mono NF Bold
italic_font             Maple Mono NF Italic
bold_italic_font        Maple Mono NF Bold Italic
font_size               9

# color palette
background              #11111b
foreground              #dce0f4
cursor                  #7878c8
cursor_text_color       #11111b
selection_background    #3d3d5c
selection_foreground    #f0f0ff
color0                  #181825
color8                  #3d3d5c
color1                  #c47ab8
color9                  #d48fc8
color2                  #7a9bbf
color10                 #8fb8d8
color3                  #c4a87a
color11                 #d4b890
color4                  #7878c8
color12                 #9898e0
color5                  #c47ab8
color13                 #d494cc
color6                  #7abfc4
color14                 #90d0d4
color7                  #dce0f4
color15                 #f0f0ff

# window
background_opacity      0.88
window_padding_width    12
hide_window_decorations yes
confirm_os_window_close 0

# tabs
tab_bar_style               powerline
tab_powerline_style         angled
tab_bar_background          #11111b
tab_bar_margin_color        #11111b
active_tab_foreground       #f0f0ff
active_tab_background       #7878c8
inactive_tab_foreground     #9898c0
inactive_tab_background     #181825
active_tab_font_style       bold
inactive_tab_font_style     normal

# misc
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
strip_trailing_spaces       smart
