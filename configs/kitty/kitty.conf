# font
font_family             Maple Mono NF
bold_font               Maple Mono NF Bold
italic_font             Maple Mono NF Italic
bold_italic_font        Maple Mono NF Bold Italic
font_size               9

# color palette
background              #0a0812
foreground              #e0d4f0
cursor                  #7c5cbf
cursor_text_color       #0a0812
selection_background    #3d2f52
selection_foreground    #f4eeff
color0                  #110d1a
color8                  #3d2f52
color1                  #c47a9b
color9                  #d48faf
color2                  #7a9bbf
color10                 #8fb8d8
color3                  #c4a87a
color11                 #d4b890
color4                  #7c5cbf
color12                 #9b7cd8
color5                  #c47a9b
color13                 #d494b5
color6                  #7abfc4
color14                 #90d0d4
color7                  #e0d4f0
color15                 #f4eeff

# window
background_opacity      0.88
window_padding_width    12
hide_window_decorations yes
confirm_os_window_close 0

# tabs
tab_bar_style               powerline
tab_powerline_style         angled
tab_bar_background          #0a0812
tab_bar_margin_color        #0a0812
active_tab_foreground       #f4eeff
active_tab_background       #7c5cbf
inactive_tab_foreground     #9b8ab0
inactive_tab_background     #110d1a
active_tab_font_style       bold
inactive_tab_font_style     normal

# misc
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
strip_trailing_spaces       smart
