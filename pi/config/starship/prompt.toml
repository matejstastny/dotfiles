"$schema" = 'https://starship.rs/config-schema.json'

# shared across every pi; hosts/<name>.toml appends [palettes.moon] and [character]

palette = "moon"
add_newline = false

format = """
$hostname$directory$git_branch$git_status$fill$jobs$python$nodejs$memory_usage${custom.temp}$cmd_duration
$character"""

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "accent bold"

[directory]
format = "[ ⟩ ](dim)[$path]($style)"
style = "#dce0f4"
truncation_length = 4
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
style = "dim"
format = "[  $symbol$branch]($style)"

[git_status]
format = "[$modified$staged$ahead_behind$conflicted](alt)"
modified = " ·"
staged = " +"
ahead = " ↑$count"
behind = " ↓$count"
diverged = " ↕"
conflicted = " ✗"
untracked = ""
deleted = ""
renamed = ""
stashed = ""
up_to_date = ""

[fill]
symbol = " "
style = "dim"

[jobs]
symbol = "❍"
style = "alt"
format = "[$symbol$number ]($style)"
number_threshold = 1
symbol_threshold = 1

[memory_usage]
disabled = false
threshold = 85
symbol = ""
style = "alt"
format = "[$symbol $ram_pct ]($style)"

# thermal headroom matters on a pi; ▲ marks the throttle neighbourhood
[custom.temp]
shell = ["/bin/sh"]
when = "test -r /sys/class/thermal/thermal_zone0/temp"
command = '''awk '{t=int($1/1000); printf "%d°%s", t, (t>70 ? " ▲" : "")}' /sys/class/thermal/thermal_zone0/temp'''
format = "[$output ](dim)"

[cmd_duration]
min_time = 2000
format = "[$duration ](dim)"

[python]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[nodejs]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"
